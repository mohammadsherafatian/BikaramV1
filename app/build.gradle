plugins {
    id 'com.android.application'
}

def signingValue = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).orNull
}
def releaseKeystorePath = signingValue('BIKARAM_KEYSTORE_PATH')
def releaseKeystorePassword = signingValue('BIKARAM_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('BIKARAM_KEY_ALIAS')
def releaseKeyPassword = signingValue('BIKARAM_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }

android {
    namespace 'com.bikaram.toy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bikaram.toy'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        lintConfig = file('lint.xml')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
